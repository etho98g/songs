<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A.S Music</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons (Premium Modern Icons) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png" type="image/png">
    
    <style>
        :root {
            --primary: #6366f1; /* Indigo 500 */
            --primary-hover: #4f46e5; /* Indigo 600 */
            --bg-base: #0f111a; /* Deep Charcoal / Blue-Gray */
            --bg-surface: #1a1d2d; 
            --glass-bg: rgba(26, 29, 45, 0.75);
            --glass-border: rgba(255, 255, 255, 0.06);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: #f8fafc;
            overflow: hidden; /* Prevent body scroll */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Animated Subtle Gradient */
        .bg-animated {
            background: radial-gradient(circle at 10% 40%, rgba(49, 46, 129, 0.25), transparent 40%),
                        radial-gradient(circle at 90% 60%, rgba(15, 23, 42, 0.4), transparent 40%);
            background-color: var(--bg-base);
            background-attachment: fixed;
        }

        /* Glassmorphism & Surface */
        .surface {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
        }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
        }

        /* Custom Scrollbars & Utilities */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .pb-safe { padding-bottom: calc(var(--safe-area-bottom) + 80px); }
        .mb-safe { margin-bottom: var(--safe-area-bottom); }
        
        .touch-target { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 24px; /* Larger touch area */
            cursor: pointer;
            position: relative;
            z-index: 10;
            margin: 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            height: 12px; width: 12px; border-radius: 50%;
            background: #fff; cursor: pointer; -webkit-appearance: none;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.15s ease, opacity 0.15s ease;
            opacity: 0;
        }
        .group:hover input[type=range]::-webkit-slider-thumb,
        input[type=range]:active::-webkit-slider-thumb { opacity: 1; transform: scale(1.3); }

        .fade-in { animation: fadeIn 0.3s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .slide-up.active { transform: translateY(0); }

        .hover-lift { transition: transform 0.2s, background 0.2s; }
        .hover-lift:hover { transform: translateY(-3px); background: rgba(255,255,255,0.05); }

        @keyframes spinSlow { 100% { transform: rotate(360deg); } }
        .spin-slow { animation: spinSlow 12s linear infinite; }
        .spin-paused { animation-play-state: paused; }

        .app-logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
    </style>
</head>
<body class="bg-animated flex flex-col h-screen text-sm md:text-base selection:bg-indigo-500/30">

    <!-- Loading Screen -->
    <div id="app-loader" class="fixed inset-0 z-[99999] bg-[var(--bg-base)] flex flex-col items-center justify-center transition-opacity duration-500">
        <img src="https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png" class="w-24 h-24 object-cover object-center rounded-full shadow-lg shadow-indigo-500/20 animate-pulse mb-6" style="aspect-ratio: 1/1;" alt="A.S Music Loading">
        <div class="text-white font-bold tracking-widest text-lg">A.S MUSIC</div>
    </div>

    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Desktop Sidebar -->
        <aside class="hidden md:flex w-64 glass-panel flex-col h-full shrink-0 z-20 shadow-[4px_0_24px_rgba(0,0,0,0.2)]">
            <div class="p-6 flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png" alt="A.S Music Logo" class="w-10 h-10 rounded-full object-cover object-center shadow-lg shadow-indigo-500/20" style="aspect-ratio: 1/1;">
                <h1 class="text-xl font-bold tracking-tight text-white">A.S Music</h1>
            </div>

            <nav class="flex-1 overflow-y-auto hide-scrollbar px-4 py-2 space-y-6">
                <!-- Modes -->
                <div>
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2">Discovery</h2>
                    <ul class="space-y-1">
                        <li><button onclick="switchMode('online'); navigate('home')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left font-medium" data-view="home"><i class="ph ph-globe-hemisphere text-lg"></i> Play Online</button></li>
                        <li><button onclick="switchMode('local'); navigate('local')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left font-medium" data-view="local"><i class="ph ph-folder-open text-lg"></i> Play Local</button></li>
                    </ul>
                </div>

                <!-- GitHub Categories (Online Mode Only) -->
                <div id="nav-categories-section">
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2 mt-6">GitHub Library</h2>
                    <ul class="space-y-1">
                        <li><button onclick="navigate('category', 'Qawwali')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left" data-view="category" data-cat="Qawwali"><i class="ph ph-hands-praying text-lg"></i> Qawwali</button></li>
                        <li><button onclick="navigate('category', 'Bhajan')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left" data-view="category" data-cat="Bhajan"><i class="ph ph-om text-lg"></i> Bhajan</button></li>
                        <li><button onclick="navigate('category', 'English')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left" data-view="category" data-cat="English"><i class="ph ph-globe text-lg"></i> English</button></li>
                        <li><button onclick="navigate('category', 'Hindi')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left" data-view="category" data-cat="Hindi"><i class="ph ph-music-notes text-lg"></i> Hindi</button></li>
                        <li><button onclick="navigate('category', 'Punjabi')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left" data-view="category" data-cat="Punjabi"><i class="ph ph-guitar text-lg"></i> Punjabi</button></li>
                    </ul>
                </div>

                <!-- Library -->
                <div>
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 px-2 mt-6">My Collection</h2>
                    <ul class="space-y-1">
                        <li><button onclick="navigate('favorites')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left" data-view="favorites"><i class="ph-fill ph-heart text-indigo-400 text-lg"></i> Favorites</button></li>
                        <li><button onclick="navigate('playlists')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left" data-view="playlists"><i class="ph ph-playlist text-lg"></i> Playlists</button></li>
                        <li><button onclick="navigate('settings')" class="w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 transition-colors text-left mt-4" data-view="settings"><i class="ph ph-gear text-lg"></i> Settings</button></li>
                    </ul>
                </div>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col relative z-10 h-full">
            
            <!-- Mobile Header & Desktop Search -->
            <header class="h-[64px] md:h-[72px] px-4 md:px-8 flex items-center justify-between shrink-0 sticky top-0 z-20 bg-[var(--bg-base)]/80 backdrop-blur-xl border-b border-white/5">
                
                <!-- Mobile Branding -->
                <div class="md:hidden flex items-center gap-2 font-bold text-lg text-white">
                    <img src="https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png" alt="A.S Music Logo" class="w-8 h-8 rounded-full object-cover object-center shadow-sm shadow-indigo-500/20" style="aspect-ratio: 1/1;">
                    A.S Music
                </div>

                <!-- Global Search -->
                <div class="flex items-center gap-4 flex-1 justify-end md:justify-start md:ml-4">
                    <div class="relative group hidden md:block max-w-sm w-full">
                        <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg group-focus-within:text-indigo-400 transition-colors"></i>
                        <input type="text" id="global-search" placeholder="Search songs, artists..." class="w-full bg-white/5 border border-white/10 rounded-full py-2 pl-11 pr-4 focus:outline-none focus:border-indigo-500/50 focus:bg-white/10 transition-all text-sm text-white placeholder-slate-500" onkeyup="handleSearchInput(event)">
                    </div>
                    
                    <!-- Mobile Search/Settings Actions -->
                    <button onclick="navigate('search')" class="md:hidden touch-target rounded-full bg-white/5 text-white hover:bg-white/10 transition-colors"><i class="ph ph-magnifying-glass text-xl"></i></button>
                    <button onclick="navigate('settings')" class="md:hidden touch-target rounded-full text-slate-300 hover:text-white transition-colors"><i class="ph ph-gear text-xl"></i></button>
                </div>
            </header>

            <!-- Dynamic Views Container -->
            <div id="view-container" class="flex-1 overflow-y-auto hide-scrollbar p-4 md:p-8 pb-safe relative">
                <!-- Content Injected via JavaScript -->
            </div>
            
        </main>
    </div>

    <div class="hidden md:flex fixed bottom-0 left-0 right-0 h-24 glass-panel z-40 items-center px-6 justify-between border-t border-white/5 shadow-[0_-10px_40px_rgba(0,0,0,0.3)] bg-[#131520]/95">
        
        <!-- Track Info -->
        <div class="flex items-center gap-4 w-1/4 min-w-[250px]">
            <div class="relative w-14 h-14 flex-shrink-0 group">
                <img id="player-cover" src="https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png" onerror="this.src='https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png'; this.classList.add('object-cover','rounded-full'); this.classList.remove('rounded-md'); document.getElementById('player-cover-overlay').classList.add('rounded-full');" alt="Cover" class="w-full h-full object-cover rounded-full shadow-md spin-paused" style="aspect-ratio: 1/1;">
                <div id="player-cover-overlay" class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer backdrop-blur-[2px] rounded-full" onclick="openFullscreenPlayer()"><i class="ph ph-arrows-out-simple text-white text-xl"></i></div>
            </div>
            <div class="flex flex-col overflow-hidden">
                <span id="player-title" class="font-semibold text-white truncate text-sm">Not Playing</span>
                <span id="player-artist" class="text-xs text-slate-400 truncate mt-0.5">Select a track</span>
            </div>
            <button id="player-fav-btn" onclick="toggleFavoriteCurrent()" class="text-slate-500 hover:text-indigo-400 ml-auto transition-colors touch-target opacity-50 cursor-not-allowed" disabled><i class="ph ph-heart text-xl"></i></button>
        </div>

        <!-- Main Player Controls & Advanced Timeline -->
        <div class="flex flex-col items-center flex-1 max-w-2xl px-8">
            <div class="flex items-center gap-6 mb-1">
                <button id="btn-shuffle" onclick="toggleShuffle()" class="text-slate-400 hover:text-white transition-colors touch-target"><i class="ph ph-shuffle text-xl"></i></button>
                <button onclick="playPrev()" class="text-slate-300 hover:text-white transition-colors touch-target"><i class="ph-fill ph-skip-back text-2xl"></i></button>
                
                <button id="btn-play-pause" onclick="togglePlayPause()" class="w-12 h-12 flex items-center justify-center rounded-full bg-white text-indigo-600 hover:scale-105 hover:bg-slate-200 transition-all shadow-[0_4px_14px_rgba(255,255,255,0.2)]">
                    <i class="ph-fill ph-play text-xl ml-1"></i>
                </button>
                
                <button onclick="playNext()" class="text-slate-300 hover:text-white transition-colors touch-target"><i class="ph-fill ph-skip-forward text-2xl"></i></button>
                <button id="btn-repeat" onclick="toggleRepeat()" class="text-slate-400 hover:text-white transition-colors touch-target"><i class="ph ph-repeat text-xl"></i></button>
            </div>
            
            <div class="w-full flex items-center gap-3 text-xs text-slate-400 font-medium tracking-wide">
                <span id="time-current" class="w-10 text-right font-mono">0:00</span>
                <div class="flex-1 relative group h-4 flex items-center">
                    <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek timeline"
                           oninput="handleSeekInput(this.value, false)" 
                           onchange="handleSeekChange(this.value)">
                    <div class="h-1 w-full bg-white/10 rounded-full overflow-hidden absolute pointer-events-none top-1/2 -translate-y-1/2">
                        <div id="progress-fill" class="h-full bg-indigo-500 rounded-full pointer-events-none" style="width: 0%"></div>
                    </div>
                </div>
                <span id="time-total" class="w-10 font-mono">0:00</span>
            </div>
        </div>

        <!-- Volume Controls -->
        <div class="flex items-center justify-end gap-3 w-1/4 min-w-[200px]">
            <button onclick="toggleMute()" class="text-slate-400 hover:text-white transition-colors touch-target"><i id="icon-volume" class="ph-fill ph-speaker-high text-xl"></i></button>
            <div class="w-24 relative group h-4 flex items-center">
                 <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" aria-label="Volume" oninput="handleVolume(this.value)">
                 <div class="h-1 w-full bg-white/10 rounded-full overflow-hidden absolute pointer-events-none top-1/2 -translate-y-1/2">
                    <div id="volume-fill" class="h-full bg-white rounded-full pointer-events-none" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="mobile-mini-player" class="md:hidden fixed bottom-[64px] left-2 right-2 h-14 bg-slate-800/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl z-40 flex items-center px-3 gap-3 cursor-pointer hidden transform transition-transform mb-safe" onclick="openFullscreenPlayer()">
        <!-- Mini Progress -->
        <div class="absolute top-0 left-0 w-full h-0.5 bg-white/5 rounded-t-xl overflow-hidden">
            <div id="m-mini-progress" class="h-full bg-indigo-500 w-0 transition-all duration-150"></div>
        </div>
        
        <img id="m-mini-cover" src="https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png" onerror="this.src='https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png'; this.classList.add('object-cover','rounded-full'); this.classList.remove('rounded-md');" alt="Cover" class="w-10 h-10 rounded-full object-cover spin-paused shadow-sm" style="aspect-ratio: 1/1;">
        <div class="flex-1 overflow-hidden">
            <div id="m-mini-title" class="font-medium text-sm text-white truncate">Not Playing</div>
            <div id="m-mini-artist" class="text-[11px] text-slate-400 truncate">Select a track</div>
        </div>
        <button id="m-mini-play" onclick="event.stopPropagation(); togglePlayPause()" class="touch-target text-white"><i class="ph-fill ph-play text-2xl"></i></button>
        <button onclick="event.stopPropagation(); playNext()" class="touch-target text-slate-300 pr-1"><i class="ph-fill ph-skip-forward text-xl"></i></button>
    </div>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 h-[64px] bg-[var(--bg-base)]/95 backdrop-blur-xl border-t border-white/5 z-30 flex items-center justify-around px-2 text-[10px] font-medium text-slate-400 pb-safe">
        <button onclick="switchMode('online'); navigate('home')" class="nav-mobile-btn flex flex-col items-center gap-1 p-2 w-16 hover:text-white transition-colors" data-view="home">
            <i class="ph ph-globe-hemisphere text-2xl"></i> <span>Online</span>
        </button>
        <button onclick="switchMode('local'); navigate('local')" class="nav-mobile-btn flex flex-col items-center gap-1 p-2 w-16 hover:text-white transition-colors" data-view="local">
            <i class="ph ph-folder-open text-2xl"></i> <span>Local</span>
        </button>
        <button onclick="navigate('favorites')" class="nav-mobile-btn flex flex-col items-center gap-1 p-2 w-16 hover:text-white transition-colors" data-view="favorites">
            <i class="ph ph-heart text-2xl"></i> <span>Favorites</span>
        </button>
        <button onclick="navigate('settings')" class="nav-mobile-btn flex flex-col items-center gap-1 p-2 w-16 hover:text-white transition-colors" data-view="settings">
            <i class="ph ph-gear text-2xl"></i> <span>Settings</span>
        </button>
    </nav>

    <div id="mobile-full-player" class="slide-up fixed inset-0 z-50 flex flex-col hidden items-center bg-gradient-to-b from-[#1a1c29] to-[#0a0b10]">
        <!-- Header -->
        <div class="w-full pt-10 pb-4 px-4 flex items-center justify-between shrink-0">
            <button onclick="closeFullscreenPlayer()" class="touch-target bg-white/5 rounded-full hover:bg-white/10 transition-colors text-white"><i class="ph ph-caret-down text-2xl"></i></button>
            <span class="text-xs font-bold tracking-widest text-slate-400" id="m-full-mode-text">ONLINE</span>
            <div class="w-[44px]"></div> <!-- Spacer for center alignment -->
        </div>

        <!-- Artwork (Responsive constraints) -->
        <div class="w-full flex justify-center items-center flex-1 px-8 py-4 shrink-0 min-h-[250px]">
            <img id="m-full-cover" src="https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png" onerror="this.src='https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png'; this.classList.add('object-cover','rounded-full'); this.classList.remove('rounded-2xl');" alt="Cover" class="rounded-full object-cover shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-white/10" style="width: min(80vw, 360px); aspect-ratio: 1/1;">
        </div>

        <!-- Info & Controls Container -->
        <div class="w-full px-8 pb-12 flex flex-col shrink-0 max-w-md mx-auto mb-safe">
            <div class="flex items-center justify-between mb-6">
                <div class="flex flex-col overflow-hidden pr-4">
                    <span id="m-full-title" class="font-bold text-2xl text-white truncate mb-1">Title</span>
                    <span id="m-full-artist" class="text-indigo-400 text-sm truncate">Artist</span>
                </div>
                <button id="m-full-fav" onclick="toggleFavoriteCurrent()" class="text-slate-400 hover:text-indigo-400 transition-colors shrink-0 touch-target"><i class="ph ph-heart text-3xl"></i></button>
            </div>

            <!-- Mobile Advanced Timeline -->
            <div class="w-full space-y-2 mb-8">
                <div class="relative group h-8 flex items-center"> <!-- Taller touch target -->
                    <input type="range" id="m-progress-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek timeline"
                           oninput="handleSeekInput(this.value, true)" 
                           onchange="handleSeekChange(this.value)">
                    <div class="h-1.5 w-full bg-white/20 rounded-full overflow-hidden absolute pointer-events-none top-1/2 -translate-y-1/2">
                        <div id="m-progress-fill" class="h-full bg-indigo-500 rounded-full pointer-events-none" style="width: 0%"></div>
                    </div>
                </div>
                <div class="flex justify-between text-xs font-medium text-slate-400 tracking-wide font-mono px-1">
                    <span id="m-time-current">0:00</span>
                    <span id="m-time-total">0:00</span>
                </div>
            </div>

            <!-- Playback Controls -->
            <div class="flex items-center justify-between w-full">
                <button id="m-btn-shuffle" onclick="toggleShuffle()" class="text-slate-400 touch-target"><i class="ph ph-shuffle text-2xl"></i></button>
                <button onclick="playPrev()" class="text-white touch-target"><i class="ph-fill ph-skip-back text-4xl"></i></button>
                <button id="m-btn-play-pause" onclick="togglePlayPause()" class="w-[72px] h-[72px] flex items-center justify-center rounded-full bg-white text-indigo-600 shadow-[0_4px_24px_rgba(255,255,255,0.2)] transform active:scale-95 transition-all">
                    <i class="ph-fill ph-play text-4xl ml-2"></i>
                </button>
                <button onclick="playNext()" class="text-white touch-target"><i class="ph-fill ph-skip-forward text-4xl"></i></button>
                <button id="m-btn-repeat" onclick="toggleRepeat()" class="text-slate-400 touch-target"><i class="ph ph-repeat text-2xl"></i></button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-4 md:top-8 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4 items-center"></div>

    <div id="custom-modal" class="fixed inset-0 z-[10000] bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-[var(--bg-surface)] border border-white/10 rounded-2xl p-6 max-w-sm w-full shadow-2xl transform scale-95 transition-transform duration-200" id="custom-modal-content">
            <h3 id="modal-title" class="text-lg font-bold text-white mb-2">Confirm</h3>
            <p id="modal-desc" class="text-slate-300 text-sm mb-6">Are you sure you want to do this?</p>
            <div class="flex items-center justify-end gap-3">
                <button onclick="closeModal(false)" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/10 transition-colors">Cancel</button>
                <button id="modal-confirm-btn" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-500 transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONSTANTS & CONFIG ---
        const APP_LOGO = 'https://raw.githubusercontent.com/etho98g/songs/main/Images/Music%20app%20logo.png';
        const ITUNES_API_BASE = 'https://itunes.apple.com/search';
        
        // --- APP STATE ---
        const AppState = {
            mode: 'online', // 'online' | 'local'
            currentView: 'home', // 'home' | 'search' | 'favorites' | 'category' | 'settings' | 'playlists'
            activeCategory: '', 
            
            onlineData: { query: '', results: [] },
            localData: { files: [], parsedTracks: [] },
            
            // GitHub Dynamics
            categories: {
                'Qawwali': { songs: [], loaded: false, loading: false, api: 'https://api.github.com/repos/etho98g/songs/contents/Qawwali' },
                'Bhajan':  { songs: [], loaded: false, loading: false, api: 'https://api.github.com/repos/etho98g/songs/contents/Bhajan' },
                'English': { songs: [], loaded: false, loading: false, api: 'https://api.github.com/repos/etho98g/songs/contents/English' },
                'Hindi':   { songs: [], loaded: false, loading: false, api: 'https://api.github.com/repos/etho98g/songs/contents/Hindi' },
                'Punjabi': { songs: [], loaded: false, loading: false, api: 'https://api.github.com/repos/etho98g/songs/contents/Punjabi' }
            },
            categorySearchQuery: '', 
            
            favorites: [], 
            playlists: [], // Custom playlists feature
            settings: { volume: 1, shuffle: false, repeat: 0 }, 
            
            audio: new Audio(),
            currentTrack: null,
            isPlaying: false,
            
            queue: [],
            queueIndex: -1,
            originalQueue: [],
            
            isDraggingSlider: false
        };

        let currentObjUrl = null; 

        // --- STORAGE ---
        function loadSettings() {
            try {
                const f = localStorage.getItem('asmusic_favs');
                if (f) AppState.favorites = JSON.parse(f);
                const s = localStorage.getItem('asmusic_settings');
                if (s) {
                    AppState.settings = { ...AppState.settings, ...JSON.parse(s) };
                    AppState.audio.volume = AppState.settings.volume;
                }
                const p = localStorage.getItem('asmusic_playlists');
                if (p) AppState.playlists = JSON.parse(p);
            } catch (e) { console.error("Storage load error", e); }
        }
        function saveSettings() {
            localStorage.setItem('asmusic_favs', JSON.stringify(AppState.favorites));
            localStorage.setItem('asmusic_settings', JSON.stringify(AppState.settings));
            localStorage.setItem('asmusic_playlists', JSON.stringify(AppState.playlists));
        }

        // --- CUSTOM UI: TOAST & MODAL ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = 'ph-info';
            let colors = 'bg-slate-800 border-slate-600';
            if (type === 'success') { icon = 'ph-check-circle text-emerald-400'; colors = 'bg-slate-900 border-emerald-500/30'; }
            if (type === 'error') { icon = 'ph-warning-circle text-red-400'; colors = 'bg-slate-900 border-red-500/30'; }
            
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-full shadow-2xl border ${colors} text-white text-sm font-medium transition-all duration-300 transform -translate-y-4 opacity-0 pointer-events-auto backdrop-blur-md`;
            toast.innerHTML = `<i class="ph-fill ${icon} text-lg"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => { toast.classList.remove('-translate-y-4', 'opacity-0'); });
            
            setTimeout(() => {
                toast.classList.add('-translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let modalCallback = null;
        function showModal(title, desc, confirmText, callback, isDestructive = false) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            const btn = document.getElementById('modal-confirm-btn');
            btn.textContent = confirmText;
            btn.className = `px-4 py-2 rounded-lg text-sm font-medium text-white transition-colors ${isDestructive ? 'bg-red-600 hover:bg-red-500' : 'bg-indigo-600 hover:bg-indigo-500'}`;
            
            modalCallback = callback;
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            });
        }
        function closeModal(confirmed) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                if (confirmed && modalCallback) modalCallback();
                modalCallback = null;
            }, 200);
        }
        document.getElementById('modal-confirm-btn').addEventListener('click', () => closeModal(true));

        // --- NAVIGATION & VIEWS ---
        function switchMode(mode) {
            if (AppState.mode === mode) return;
            AppState.mode = mode;
            
            const onlineBtn = document.getElementById('nav-mode-online');
            if (onlineBtn) onlineBtn.className = mode === 'online' ? 'w-full nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-left bg-indigo-500/10 text-indigo-400 font-medium border border-indigo-500/20' : 'w-full nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all text-left border border-transparent';
            
            const localBtn = document.getElementById('nav-mode-local');
            if (localBtn) localBtn.className = mode === 'local' ? 'w-full nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all text-left bg-indigo-500/10 text-indigo-400 font-medium border border-indigo-500/20' : 'w-full nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all text-left border border-transparent';
            
            const catSection = document.getElementById('nav-categories-section');
            if (catSection) catSection.style.display = mode === 'online' ? 'block' : 'none';

            const searchInput = document.getElementById('global-search');
            if(searchInput) searchInput.placeholder = mode === 'online' ? "Search online music..." : "Search local files...";
            
            showToast(`Switched to ${mode === 'online' ? 'Online' : 'Local'} Library`, 'info');
            updateNavHighlights();
        }

        function navigate(view, category = '') {
            AppState.currentView = view;
            if (category) {
                AppState.activeCategory = category;
                AppState.categorySearchQuery = ''; 
            }
            if (view !== 'search') {
                const globalS = document.getElementById('global-search');
                if(globalS) globalS.value = '';
            }
            updateNavHighlights();
            renderView(view);
        }

        function updateNavHighlights() {
            // Desktop
            document.querySelectorAll('.nav-view-btn').forEach(btn => {
                let isActive = false;
                if (AppState.currentView === 'category') isActive = btn.dataset.view === 'category' && btn.dataset.cat === AppState.activeCategory;
                else isActive = btn.dataset.view === AppState.currentView && !btn.dataset.cat;
                btn.className = isActive ? 'w-full nav-view-btn flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors text-left bg-white/10 text-white font-medium' : 'w-full nav-view-btn flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-colors text-left font-medium';
            });
            // Mobile
            document.querySelectorAll('.nav-mobile-btn').forEach(btn => {
                let isActive = btn.dataset.view === AppState.currentView;
                btn.className = isActive ? 'nav-mobile-btn flex flex-col items-center gap-1 p-2 w-16 text-indigo-400 transition-colors' : 'nav-mobile-btn flex flex-col items-center gap-1 p-2 w-16 text-slate-400 hover:text-white transition-colors';
            });
        }

        function getCategoryCover(cat) {
            return APP_LOGO;
        }

        function renderSkeletons() {
            return Array(5).fill(0).map(() => `
                <div class="flex items-center gap-3 p-3 border-b border-white/5 animate-pulse">
                    <div class="w-10 h-10 bg-white/5 rounded shrink-0"></div>
                    <div class="flex flex-col flex-1 gap-2">
                        <div class="h-3 w-3/4 bg-white/5 rounded"></div>
                        <div class="h-2 w-1/2 bg-white/5 rounded"></div>
                    </div>
                    <div class="w-8 h-8 bg-white/5 rounded-full"></div>
                </div>
            `).join('');
        }

        function renderEmptyState(icon, title, subtitle) {
            return `
                <div class="flex flex-col items-center justify-center py-20 px-4 text-center">
                    <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-6 shadow-inner border border-white/5">
                        <i class="ph ${icon} text-4xl text-slate-500"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-2">${title}</h3>
                    <p class="text-slate-400 max-w-md text-sm">${subtitle}</p>
                </div>
            `;
        }

        function renderView(view) {
            const container = document.getElementById('view-container');
            let html = '';

            if (view === 'home') {
                // Mobile Horizontal Categories
                const mobileCategories = `
                    <div class="md:hidden mb-8">
                            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Explore Categories</h3>
                            <div class="flex overflow-x-auto hide-scrollbar gap-4 pb-2 snap-x">
                                ${Object.keys(AppState.categories).map(cat => `
                                    <div class="snap-start shrink-0 w-36 h-32 rounded-xl relative overflow-hidden bg-slate-800 touch-target shadow-lg border border-white/5 flex flex-col items-center justify-center" onclick="navigate('category', '${cat}')">
                                        <img src="${getCategoryCover(cat)}" class="w-16 h-16 rounded-full object-cover object-center shadow-md mb-2" style="aspect-ratio: 1/1;">
                                        <span class="text-sm font-bold text-white">${cat}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                    html = `
                        <div class="fade-in max-w-5xl mx-auto">
                            <div class="flex items-center gap-4 mb-6">
                                <img src="${APP_LOGO}" class="w-12 h-12 rounded-full object-cover object-center shadow-lg hidden md:block" style="aspect-ratio: 1/1;" alt="Logo">
                                <div>
                                    <h2 class="text-2xl md:text-3xl font-bold mb-1 tracking-tight text-white">Discover <span class="text-indigo-400">Online</span></h2>
                                    <p class="text-slate-400 text-sm">Stream millions of previews directly from the web.</p>
                                </div>
                            </div>
                            
                            <!-- Search Card (Mobile focuses to search view) -->
                            <div class="bg-gradient-to-br from-indigo-900/40 to-[#1a1d2d]/80 border border-indigo-500/20 rounded-2xl p-6 mb-8 flex flex-col sm:flex-row items-center justify-between gap-4 cursor-pointer hover:border-indigo-500/40 transition-colors" onclick="document.getElementById('global-search')?.focus(); navigate('search')">
                                <div>
                                    <h3 class="text-lg font-bold text-white mb-1">Global Music Search</h3>
                                    <p class="text-slate-400 text-sm">Find any artist, album, or track instantly.</p>
                                </div>
                                <div class="w-12 h-12 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0"><i class="ph ph-magnifying-glass text-xl"></i></div>
                            </div>

                            ${mobileCategories}

                            <!-- Desktop Categories Grid -->
                            <div class="hidden md:block">
                                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Featured Collections</h3>
                                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                                    ${Object.keys(AppState.categories).map(cat => `
                                    <div class="bg-white/5 border border-white/5 rounded-2xl overflow-hidden hover-lift cursor-pointer group shadow-lg" onclick="navigate('category', '${cat}')">
                                        <div class="h-36 relative overflow-hidden bg-slate-800 flex flex-col items-center justify-center p-4">
                                            <img src="${getCategoryCover(cat)}" class="w-20 h-20 rounded-full object-cover object-center shadow-lg group-hover:scale-110 transition-transform duration-500 mb-3" style="aspect-ratio: 1/1;">
                                            <h4 class="text-base font-bold text-white">${cat}</h4>
                                    </div>
                                </div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } 
            else if (view === 'local') {
                html = `
                    <div class="fade-in max-w-5xl mx-auto">
                        <div class="flex items-center gap-4 mb-6">
                            <img src="${APP_LOGO}" class="app-logo shadow-lg hidden md:block" alt="Logo">
                            <div>
                                <h2 class="text-2xl md:text-3xl font-bold mb-1 tracking-tight text-white">Your <span class="text-indigo-400">Local Files</span></h2>
                                <p class="text-slate-400 text-sm">Play audio files directly from your device storage.</p>
                            </div>
                        </div>
                        
                        ${AppState.localData.parsedTracks.length === 0 ? `
                            <div class="flex flex-col items-center justify-center py-16 px-4 text-center bg-white/5 rounded-3xl border border-white/5 border-dashed">
                                <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mb-4"><i class="ph ph-folder-open text-3xl text-slate-400"></i></div>
                                <h3 class="text-lg font-bold text-white mb-2">No Local Music</h3>
                                <p class="text-slate-400 max-w-sm mb-6 text-sm">Select a folder or music files to start playing.</p>
                                <div class="flex flex-col sm:flex-row gap-3 items-center justify-center w-full">
                                    <input type="file" id="folder-upload" webkitdirectory multiple class="hidden" onchange="handleLocalFiles(event)">
                                    <button onclick="document.getElementById('folder-upload').click()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-full font-medium transition-all shadow-lg text-sm flex items-center justify-center gap-2 w-full sm:w-auto">
                                        <i class="ph ph-folder-plus text-lg"></i> Select Music Folder
                                    </button>
                                    <input type="file" id="file-upload" accept="audio/*" multiple class="hidden" onchange="handleLocalFiles(event)">
                                    <button onclick="document.getElementById('file-upload').click()" class="bg-white/10 hover:bg-white/20 text-white px-6 py-2.5 rounded-full font-medium transition-all shadow-lg text-sm flex items-center justify-center gap-2 w-full sm:w-auto">
                                        <i class="ph ph-file-audio text-lg"></i> Select Files
                                    </button>
                                </div>
                                <p class="text-xs text-slate-500 mt-8 max-w-sm">Note: For security reasons, browsers require you to re-select your local folder after a page refresh. Your files remain on your device and are never uploaded.</p>
                            </div>
                        ` : `
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 bg-white/5 p-4 rounded-xl border border-white/5">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-indigo-500/20 text-indigo-400 rounded-lg flex items-center justify-center"><i class="ph-fill ph-files text-xl"></i></div>
                                    <div>
                                        <h3 class="font-bold text-white text-sm">Local Library Ready</h3>
                                        <p class="text-xs text-slate-400">${AppState.localData.parsedTracks.length} tracks loaded</p>
                                    </div>
                                </div>
                                <div class="flex gap-2 w-full sm:w-auto">
                                    <button onclick="playContext(AppState.localData.parsedTracks, 0)" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2"><i class="ph-fill ph-play"></i> Play All</button>
                                    <input type="file" id="folder-upload-change" webkitdirectory multiple class="hidden" onchange="handleLocalFiles(event)">
                                    <button onclick="document.getElementById('folder-upload-change').click()" class="flex-1 sm:flex-none bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2"><i class="ph ph-arrows-clockwise"></i> Change</button>
                                </div>
                            </div>
                            <p class="text-xs text-slate-500 mb-4 px-2">Note: Library will reset upon page refresh due to browser security policies.</p>
                            ${renderTrackList(AppState.localData.parsedTracks)}
                        `}
                    </div>
                `;
            }
            else if (view === 'search') {
                html = `
                    <div class="fade-in max-w-4xl mx-auto mb-6 flex flex-col h-full">
                        <div class="relative group md:hidden mb-4 shrink-0">
                            <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                            <input type="text" id="mobile-search" placeholder="Search ${AppState.mode}..." class="w-full bg-[var(--bg-surface)] border border-white/10 rounded-full py-3 pl-11 pr-10 focus:outline-none focus:border-indigo-500/50 text-white shadow-lg transition-all text-sm" onkeyup="handleSearchInput(event, true)">
                            <button onclick="document.getElementById('mobile-search').value=''; handleSearchInput({target:{value:''}})" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 touch-target w-8 h-8"><i class="ph ph-x"></i></button>
                        </div>
                        <h2 class="text-lg font-bold mb-4 text-white hidden md:flex items-center gap-2"><i class="ph ph-magnifying-glass text-indigo-400"></i> Search Results</h2>
                        <div id="search-results-area" class="flex-1 overflow-y-auto hide-scrollbar pb-4">
                            ${renderEmptyState('ph-keyboard', 'Search Library', `Start typing to search ${AppState.mode === 'online' ? 'Apple Music' : 'your local files'}...`)}
                        </div>
                    </div>
                `;
            }
            else if (view === 'category') {
                const catName = AppState.activeCategory;
                const catData = AppState.categories[catName];
                
                if (!catData.loaded && !catData.loading) fetchCategorySongs(catName);

                let songs = catData.songs;
                if (AppState.categorySearchQuery) {
                    const q = AppState.categorySearchQuery.toLowerCase();
                    songs = songs.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
                }

                let content = '';
                if (catData.loading) {
                    content = `<div class="mt-4">${renderSkeletons()}</div>`;
                } else if (catData.songs.length === 0) {
                    content = renderEmptyState('ph-music-notes-simple', 'No songs found', 'Upload audio files to this GitHub folder and refresh.');
                } else {
                    content = `
                        <div class="flex items-center justify-between mb-4 mt-6">
                            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider">${songs.length} Track${songs.length !== 1 ? 's' : ''}</div>
                            <div class="relative w-48 hidden md:block">
                                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" placeholder="Filter..." class="w-full bg-black/20 border border-white/10 rounded-lg py-1.5 pl-9 pr-3 focus:outline-none focus:border-indigo-500/50 text-white text-xs transition-all" value="${AppState.categorySearchQuery}" oninput="AppState.categorySearchQuery = this.value; renderView('category')">
                            </div>
                        </div>
                        <div class="border-t border-white/5">
                            ${songs.length > 0 ? renderTrackList(songs) : '<div class="py-10 text-center text-slate-500 text-sm">No matching tracks.</div>'}
                        </div>
                    `;
                }

                html = `
                    <div class="fade-in max-w-5xl mx-auto">
                        <button onclick="navigate('home')" class="text-slate-400 hover:text-white mb-4 flex items-center gap-1 text-sm transition-colors touch-target -ml-2 px-2"><i class="ph ph-arrow-left"></i> Back</button>
                        
                        <div class="flex flex-col md:flex-row items-center md:items-end gap-6 mb-6 text-center md:text-left bg-gradient-to-t from-white/5 to-transparent p-6 rounded-2xl border border-white/5">
                            <div class="w-32 h-32 md:w-48 md:h-48 rounded-full overflow-hidden shadow-2xl shrink-0 mx-auto md:mx-0">
                                <img src="${getCategoryCover(catName)}" class="w-full h-full object-cover object-center" style="aspect-ratio: 1/1;">
                            </div>
                            <div class="flex-1 w-full">
                                <span class="text-[10px] font-bold tracking-widest text-indigo-400 uppercase mb-1 block">GitHub Collection</span>
                                <h2 class="text-3xl md:text-4xl font-bold mb-2 tracking-tight text-white">${catName}</h2>
                                <p class="text-slate-400 mb-6 text-sm">Dynamically loaded from public repository.</p>
                                <div class="flex flex-wrap items-center justify-center md:justify-start gap-3">
                                    <button onclick="playContext(AppState.categories['${catName}'].songs, 0)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-full text-sm font-medium transition-all shadow-lg flex items-center gap-2 ${catData.songs.length === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${catData.songs.length === 0 ? 'disabled' : ''}><i class="ph-fill ph-play text-lg"></i> Play All</button>
                                    <button onclick="forceRefreshCategory('${catName}')" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2.5 rounded-full text-sm font-medium transition-all flex items-center gap-2"><i class="ph ph-arrows-clockwise text-lg"></i> Refresh</button>
                                </div>
                            </div>
                        </div>
                        ${content}
                    </div>
                `;
            }
            else if (view === 'favorites') {
                const filteredFavs = AppState.favorites.filter(f => f.mode === AppState.mode);
                html = `
                    <div class="fade-in max-w-5xl mx-auto">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center"><i class="ph-fill ph-heart text-xl"></i></div>
                            <h2 class="text-2xl font-bold tracking-tight text-white">Favorites <span class="text-xs font-normal text-slate-400 ml-2 bg-white/5 px-2 py-0.5 rounded-md uppercase">${AppState.mode}</span></h2>
                        </div>
                        ${filteredFavs.length === 0 ? renderEmptyState('ph-heart-break', 'No favorites yet', 'Like songs in this mode to see them here.') : renderTrackList(filteredFavs, true)}
                    </div>
                `;
            }
            else if (view === 'playlists') {
                html = `
                    <div class="fade-in max-w-5xl mx-auto">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center"><i class="ph-fill ph-playlist text-xl"></i></div>
                                <h2 class="text-2xl font-bold tracking-tight text-white">Playlists</h2>
                            </div>
                            <button onclick="showToast('Playlist creation coming soon!', 'info')" class="text-sm bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-white font-medium transition-colors"><i class="ph ph-plus mr-1"></i> New</button>
                        </div>
                        ${renderEmptyState('ph-playlist', 'No Playlists', 'Create custom playlists to organize your favorite tracks.')}
                    </div>
                `;
            }
            else if (view === 'settings') {

        function renderTrackList(tracks, isStored = false) {
            return `
                <div class="flex flex-col border-t border-white/5 mt-2">
                    ${tracks.map((t, idx) => {
                        const meta = isStored ? t : extractMeta(t);
                        const isFav = AppState.favorites.some(f => f.id === meta.id && f.mode === meta.mode);
                        const isActive = (AppState.currentTrack && AppState.currentTrack.id === meta.id);
                        
                        // Encoded string to safely pass object via inline onclick
                        const encodedMeta = encodeURIComponent(JSON.stringify(meta));
                        const isLogo = !meta.cover || meta.cover === APP_LOGO;
                        
                        return `
                        <div class="group flex items-center gap-3 p-2.5 hover:bg-white/5 transition-colors border-b border-white/5 last:border-0 rounded-lg mt-1 cursor-pointer ${isActive ? 'bg-indigo-500/10' : ''}" onclick="playContextStr('${encodedMeta}', ${idx})">
                            
                            <!-- Artwork -->
                            <div class="relative w-11 h-11 shrink-0 overflow-hidden shadow-sm ${isLogo ? 'rounded-full' : 'rounded-md bg-slate-800 border border-white/10'}">
                                <img src="${meta.cover || APP_LOGO}" onerror="this.src='${APP_LOGO}'; this.parentElement.classList.add('rounded-full'); this.parentElement.classList.remove('rounded-md', 'bg-slate-800', 'border'); this.classList.add('object-cover', 'rounded-full');" class="w-full h-full object-cover ${isLogo ? 'rounded-full' : ''}" style="aspect-ratio: 1/1;">
                                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 md:opacity-0 ${isActive ? '!opacity-100 bg-black/60' : ''} transition-opacity ${isLogo ? 'rounded-full' : ''}">
                                    <i class="ph-fill ph-play text-white text-lg ${isActive ? 'text-indigo-400' : ''}"></i>
                                </div>
                            </div>
                            
                            <!-- Info -->
                            <div class="flex flex-col flex-1 overflow-hidden">
                                <span class="text-sm font-medium truncate ${isActive ? 'text-indigo-400' : 'text-white'}">${meta.title}</span>
                                <span class="text-[11px] text-slate-400 truncate mt-0.5">${meta.artist}</span>
                            </div>
                            
                            <!-- Actions -->
                            <div class="flex items-center gap-1 shrink-0 md:opacity-0 group-hover:opacity-100 transition-opacity" onclick="event.stopPropagation()">
                                <button onclick="toggleFavoriteId('${meta.id}', '${encodedMeta}')" class="touch-target hover:bg-white/10 rounded-full transition-colors">
                                    <i class="${isFav ? 'ph-fill ph-heart text-rose-500' : 'ph ph-heart text-slate-400 hover:text-white'} text-lg"></i>
                                </button>
                                <button onclick="showToast('Added to queue')" class="touch-target hover:bg-white/10 rounded-full transition-colors hidden md:inline-flex">
