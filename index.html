                    `}).join('')}
                </div>
            `;
        }

        function extractMeta(rawTrack) {
            if (rawTrack.category && Object.keys(AppState.categories).includes(rawTrack.category)) {
                return { id: rawTrack.id, mode: 'online', title: rawTrack.title, artist: rawTrack.artist, cover: rawTrack.cover, url: rawTrack.url, raw: rawTrack };
            }
            if (AppState.mode === 'online') {
                return {
                    id: rawTrack.trackId?.toString(), mode: 'online', title: rawTrack.trackName || 'Unknown', artist: rawTrack.artistName || 'Unknown',
                    cover: rawTrack.artworkUrl100 ? rawTrack.artworkUrl100.replace('100x100', '300x300') : APP_LOGO, url: rawTrack.previewUrl, raw: rawTrack
                };
            } else {
                return { id: rawTrack.id, mode: 'local', title: rawTrack.title, artist: rawTrack.artist, cover: APP_LOGO, raw: rawTrack };
            }
        }

        let searchTimeout = null;
        function handleSearchInput(e, isMobile = false) {
            const query = e.target.value.trim();
            clearTimeout(searchTimeout);
            e.stopPropagation();

            searchTimeout = setTimeout(() => {
                if (AppState.mode === 'local') executeSearch(query);
                else if (query.length > 2) executeSearch(query);
                else if (query.length === 0) {
                    const c = document.getElementById('search-results-area');
                    if(c) c.innerHTML = renderEmptyState('ph-keyboard', 'Search Library', `Start typing to search ${AppState.mode === 'online' ? 'Apple Music' : 'your local files'}...`);
                }
            }, 500);
        }

        async function executeSearch(query) {
            if (AppState.currentView !== 'search') navigate('search');
            const container = document.getElementById('search-results-area');
            if(!container) return;
            if (!query) { container.innerHTML = ''; return; }

            container.innerHTML = `<div class="mt-4">${renderSkeletons()}</div>`;

            if (AppState.mode === 'online') {
                if (!navigator.onLine) {
                    container.innerHTML = renderEmptyState('ph-wifi-slash', 'Offline', 'You need an internet connection to search online.');
                    return;
                }
                try {
                    const res = await fetch(`${ITUNES_API_BASE}?term=${encodeURIComponent(query)}&media=music&limit=25`);
                    if (!res.ok) throw new Error("API Error");
                    const data = await res.json();
                    AppState.onlineData.results = data.results.filter(t => t.previewUrl);
                    
                    if (AppState.onlineData.results.length === 0) container.innerHTML = renderEmptyState('ph-smiley-sad', 'No Results', `No tracks found for "${query}"`);
                    else container.innerHTML = renderTrackList(AppState.onlineData.results);
                } catch (e) {
                    container.innerHTML = renderEmptyState('ph-warning-circle', 'Search Failed', 'Unable to reach the search server.');
                }
            } else {
                const q = query.toLowerCase();
                const results = AppState.localData.parsedTracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
                if (results.length === 0) container.innerHTML = renderEmptyState('ph-smiley-sad', 'No Results', `No local files match "${query}"`);
                else container.innerHTML = renderTrackList(results);
            }
        }

        async function fetchCategorySongs(categoryName) {
            const cat = AppState.categories[categoryName];
            if (cat.loading) return;
            cat.loading = true;
            if (AppState.currentView === 'category' && AppState.activeCategory === categoryName) renderView('category');
            
            try {
                const res = await fetch(cat.api);
                if (!res.ok) throw new Error("GitHub API Network Error");
                const data = await res.json();
                
                const validExts = ['.mp3', '.wav', '.ogg', '.m4a', '.aac', '.flac'];
                cat.songs = data
                    .filter(f => f.type === 'file' && validExts.some(ext => f.name.toLowerCase().endsWith(ext)))
                    .map(f => {
                        let cleanName = decodeURIComponent(f.name).replace(/\.[^/.]+$/, "");
                        let artist = categoryName + " Collection";
                        let title = cleanName;
                        
                        if (cleanName.includes('_')) {
                            const parts = cleanName.split('_').map(p => p.trim());
                            title = parts[0]; if (parts.length > 1) artist = parts[1];
                        } else if (cleanName.includes('-')) {
                            const parts = cleanName.split('-').map(p => p.trim());
                            artist = parts[0]; title = parts.slice(1).join('-').trim();
                        }
                        
                        return {
                            id: f.sha, title: title, artist: artist, category: categoryName, mode: "online",
                            cover: getCategoryCover(categoryName), url: f.download_url
                        };
                    });
                cat.loaded = true;
            } catch (e) {
                console.error(e);
                showToast(`Unable to load ${categoryName} songs.`, "error");
            } finally {
                cat.loading = false;
                if (AppState.currentView === 'category' && AppState.activeCategory === categoryName) renderView('category');
            }
        }
        function forceRefreshCategory(categoryName) {
            AppState.categories[categoryName].loaded = false;
            fetchCategorySongs(categoryName);
        }

        function handleLocalFiles(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            let added = 0;
            AppState.localData.files = []; AppState.localData.parsedTracks = [];

            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                if (f.type.startsWith('audio/') || f.name.match(/\.(mp3|wav|m4a|ogg|flac)$/i)) {
                    let artist = "Local File", title = f.name.replace(/\.[^/.]+$/, "");
                    if (title.includes('-')) {
                        const parts = title.split('-');
                        artist = parts[0].trim(); title = parts.slice(1).join('-').trim();
                    }
                    AppState.localData.files.push(f);
                    AppState.localData.parsedTracks.push({
                        id: `loc_${f.size}_${f.lastModified}_${i}`, title: title, artist: artist, file: f
                    });
                    added++;
                }
            }
            if (added > 0) {
                showToast(`Loaded ${added} local tracks`, 'success');
                if (AppState.currentView !== 'local') navigate('local'); else renderView('local');
            } else {
                showToast("No supported audio files found.", "error");
            }
        }

        function playContextStr(encodedMeta, reqIndex) {
            const meta = JSON.parse(decodeURIComponent(encodedMeta));
            let context = [];
            
            if (AppState.currentView === 'local') context = AppState.localData.parsedTracks;
            else if (AppState.currentView === 'category') context = AppState.categories[AppState.activeCategory].songs;
            else if (AppState.currentView === 'search' && AppState.mode === 'online') context = AppState.onlineData.results;
            else if (AppState.currentView === 'search' && AppState.mode === 'local') {
                const q = (document.getElementById('global-search')?.value || document.getElementById('mobile-search')?.value || '').toLowerCase();
                context = AppState.localData.parsedTracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
            }
            else if (AppState.currentView === 'favorites') context = AppState.favorites.filter(f => f.mode === AppState.mode);

            if (context.length === 0) context = [meta];
            
            let actualIndex = context.findIndex(t => ('mode' in t ? t.id : extractMeta(t).id) === meta.id);
            if(actualIndex === -1) actualIndex = 0;
            
            playContext(context, actualIndex);
        }

        function playContext(trackArray, startIndex = 0) {
            if (!trackArray || trackArray.length === 0) return;
            AppState.queue = trackArray.map(t => 'mode' in t ? t : extractMeta(t));
            AppState.originalQueue = [...AppState.queue];
            
            if (AppState.settings.shuffle) { doShuffleQueue(startIndex); startIndex = 0; }
            AppState.queueIndex = startIndex;
            playQueueIndex();
        }

        async function playQueueIndex() {
            if (AppState.queueIndex < 0 || AppState.queueIndex >= AppState.queue.length) return;
            
            const meta = AppState.queue[AppState.queueIndex];
            AppState.currentTrack = meta;
            if (currentObjUrl) { URL.revokeObjectURL(currentObjUrl); currentObjUrl = null; }

            try {
                if (meta.mode === 'online') {
                    AppState.audio.src = meta.url;
                } else {
                    let f = meta.raw?.file || AppState.localData.parsedTracks.find(t => t.id === meta.id)?.file;
                    if(!f) throw new Error("File missing");
                    currentObjUrl = URL.createObjectURL(f);
                    AppState.audio.src = currentObjUrl;
                }

                await AppState.audio.play();
                AppState.isPlaying = true;
                
                updatePlayerUI();
                if(document.getElementById('view-container')) renderView(AppState.currentView);
            } catch (e) {
                if (e.name === 'AbortError') return;
                showToast("Unable to play track.", "error");
                AppState.isPlaying = false;
                updatePlayPauseIcons();
                setTimeout(playNext, 1500); 
            }
        }

        function togglePlayPause() {
            if (!AppState.currentTrack) return;
            if (AppState.isPlaying) { AppState.audio.pause(); AppState.isPlaying = false; } 
            else { 
                const p = AppState.audio.play();
                if (p !== undefined) p.catch(e => { if (e.name !== 'AbortError') console.error(e); });
                AppState.isPlaying = true; 
            }
            updatePlayPauseIcons();
            updateCoverAnimation();
        }

        function playNext() {
            if (AppState.queue.length === 0) return;
            AppState.queueIndex++;
            if (AppState.queueIndex >= AppState.queue.length) {
                if (AppState.settings.repeat === 1) AppState.queueIndex = 0;
                else { AppState.queueIndex--; AppState.isPlaying = false; updatePlayPauseIcons(); updateCoverAnimation(); return; }
            }
            playQueueIndex();
        }

        function playPrev() {
            if (AppState.queue.length === 0) return;
            if (AppState.audio.currentTime > 3) { AppState.audio.currentTime = 0; return; }
            AppState.queueIndex--;
            if (AppState.queueIndex < 0) AppState.queueIndex = AppState.settings.repeat === 1 ? AppState.queue.length - 1 : 0;
            playQueueIndex();
        }

        function formatTime(s) {
            if (isNaN(s) || !isFinite(s)) return "0:00";
            const min = Math.floor(s / 60); const sec = Math.floor(s % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        AppState.audio.addEventListener('timeupdate', () => {
            const curr = AppState.audio.currentTime; const dur = AppState.audio.duration;
            if (!dur || isNaN(dur)) return;
            const percentage = (curr / dur) * 100;
            
            // Mobile Mini-Player Progress
            const miniProg = document.getElementById('m-mini-progress');
            if(miniProg) miniProg.style.width = percentage + '%';

            if (!AppState.isDraggingSlider) {
                document.getElementById('progress-bar').value = percentage;
                document.getElementById('progress-fill').style.width = percentage + '%';
                document.getElementById('time-current').textContent = formatTime(curr);
                
                document.getElementById('m-progress-bar').value = percentage;
                document.getElementById('m-progress-fill').style.width = percentage + '%';
                document.getElementById('m-time-current').textContent = formatTime(curr);
            }
        });

        AppState.audio.addEventListener('loadedmetadata', () => {
            const dur = AppState.audio.duration;
            document.getElementById('time-total').textContent = formatTime(dur);
            document.getElementById('m-time-total').textContent = formatTime(dur);
            ['progress-bar', 'm-progress-bar'].forEach(id => document.getElementById(id).value = 0);
            ['progress-fill', 'm-progress-fill', 'm-mini-progress'].forEach(id => {
                const el = document.getElementById(id); if(el) el.style.width = '0%';
            });
        });

        AppState.audio.addEventListener('ended', () => {
            if (AppState.settings.repeat === 2) { 
                AppState.audio.currentTime = 0; 
                const p = AppState.audio.play();
                if(p) p.catch(e => { if (e.name !== 'AbortError') console.error(e); });
            } 
            else playNext();
        });

        function handleSeekInput(val, isMobile) {
            AppState.isDraggingSlider = true;
            if (AppState.audio.duration) {
                const previewTime = AppState.audio.duration * (val / 100);
                if (isMobile) {
                    document.getElementById('m-progress-fill').style.width = val + '%';
                    document.getElementById('m-time-current').textContent = formatTime(previewTime);
                } else {
                    document.getElementById('progress-fill').style.width = val + '%';
                    document.getElementById('time-current').textContent = formatTime(previewTime);
                }
            }
        }

        function handleSeekChange(val) {
            if (AppState.audio.duration) AppState.audio.currentTime = AppState.audio.duration * (val / 100);
            AppState.isDraggingSlider = false;
        }

        function updatePlayerUI() {
            const t = AppState.currentTrack;
            if(!t) return;
            const cover = t.cover || APP_LOGO; 
            
            ['player-cover', 'm-mini-cover', 'm-full-cover'].forEach(id => { 
                const el = document.getElementById(id); 
                if(el) {
                    el.src = cover; 
                    const overlayId = id === 'player-cover' ? 'player-cover-overlay' : null;
                    const overlay = overlayId ? document.getElementById(overlayId) : null;
                    
                    if(cover === APP_LOGO) {
                        el.classList.add('object-cover', 'rounded-full');
                        el.classList.remove('rounded-2xl', 'rounded-md', 'rounded-lg');
                        if(overlay) overlay.classList.add('rounded-full');
                    } else {
                        el.classList.add('object-cover');
                        el.classList.remove('rounded-full');
                        if (id === 'm-full-cover') el.classList.add('rounded-2xl');
                        else el.classList.add('rounded-md');
                        if(overlay) overlay.classList.remove('rounded-full');
                    }
                } 
            });
            
            ['player-title', 'm-mini-title', 'm-full-title'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = t.title; });
            ['player-artist', 'm-mini-artist', 'm-full-artist'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent = t.artist; });
            
            const modeText = document.getElementById('m-full-mode-text');
            if(modeText) modeText.textContent = t.mode === 'online' ? 'STREAMING' : 'LOCAL AUDIO';
            
            document.getElementById('mobile-mini-player').classList.remove('hidden');

            updatePlayPauseIcons();
            updateFavIcons();
            updateCoverAnimation();
        }

        function updatePlayPauseIcons() {
            const isP = AppState.isPlaying; const cls = isP ? 'ph-fill ph-pause' : 'ph-fill ph-play';
            document.querySelector('#btn-play-pause i').className = cls + ' text-xl text-indigo-600 ' + (isP?'':'ml-1');
            document.querySelector('#m-mini-play i').className = cls + ' text-2xl';
            document.querySelector('#m-btn-play-pause i').className = cls + ' text-4xl text-indigo-600 ' + (isP?'':'ml-2');
        }

        function updateCoverAnimation() {
            const covers = [document.getElementById('player-cover'), document.getElementById('m-mini-cover')];
            covers.forEach(c => { if(c) { if(AppState.isPlaying) { c.classList.add('spin-slow'); c.classList.remove('spin-paused'); } else { c.classList.add('spin-paused'); } }});
        }

        function handleVolume(val) {
            const v = parseFloat(val); AppState.settings.volume = v; AppState.audio.volume = v;
            saveSettings(); updateVolumeUI();
        }
        function toggleMute() {
            if (AppState.audio.volume > 0) { AppState.audio.volume = 0; document.getElementById('volume-bar').value = 0; } 
            else { AppState.audio.volume = AppState.settings.volume || 1; document.getElementById('volume-bar').value = AppState.audio.volume; }
            updateVolumeUI();
        }
        function updateVolumeUI() {
            const v = AppState.audio.volume;
            const fill = document.getElementById('volume-fill'); if(fill) fill.style.width = (v*100)+'%';
            const i = document.getElementById('icon-volume');
            if(i) {
                if(v===0) i.className = 'ph-fill ph-speaker-none text-xl text-slate-600';
                else if(v<0.5) i.className = 'ph-fill ph-speaker-low text-xl text-slate-300';
                else i.className = 'ph-fill ph-speaker-high text-xl text-white';
            }
        }

        function toggleShuffle() {
            AppState.settings.shuffle = !AppState.settings.shuffle; saveSettings(); updateControlStyles();
            if (AppState.settings.shuffle && AppState.queue.length > 0) doShuffleQueue(AppState.queueIndex);
            else if (!AppState.settings.shuffle && AppState.originalQueue.length > 0) {
                const cid = AppState.queue[AppState.queueIndex]?.id;
                AppState.queue = [...AppState.originalQueue];
                if(cid) AppState.queueIndex = AppState.queue.findIndex(t => t.id === cid);
            }
        }
        function doShuffleQueue(keepIndex = -1) {
            let keepMeta = keepIndex > -1 ? AppState.queue[keepIndex] : null;
            let q = [...AppState.queue];
            if(keepMeta) q = q.filter(t => t.id !== keepMeta.id);
            for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
            if(keepMeta) { q.unshift(keepMeta); AppState.queueIndex = 0; }
            AppState.queue = q;
        }

        function toggleRepeat() { AppState.settings.repeat = (AppState.settings.repeat + 1) % 3; saveSettings(); updateControlStyles(); }

        function updateControlStyles() {
            const sc = AppState.settings.shuffle ? 'text-indigo-400' : 'text-slate-400 hover:text-white';
            document.getElementById('btn-shuffle').className = `${sc} transition-colors touch-target`;
            document.getElementById('m-btn-shuffle').className = `${sc} touch-target`;

            let rc = 'ph-repeat'; let rcol = 'text-slate-400 hover:text-white';
            if (AppState.settings.repeat === 1) rcol = 'text-indigo-400';
            if (AppState.settings.repeat === 2) { rcol = 'text-indigo-400'; rc = 'ph-repeat-once'; }
            
            document.querySelector('#btn-repeat i').className = `ph ${rc} text-xl`;
            document.getElementById('btn-repeat').className = `${rcol} transition-colors touch-target`;
            document.querySelector('#m-btn-repeat i').className = `ph ${rc} text-2xl`;
            document.getElementById('m-btn-repeat').className = `${rcol} touch-target`;
        }

        function toggleFavoriteId(id, encodedMeta) {
            const meta = JSON.parse(decodeURIComponent(encodedMeta));
            const idx = AppState.favorites.findIndex(f => f.id === id && f.mode === meta.mode);
            if (idx > -1) { AppState.favorites.splice(idx, 1); showToast('Removed from Favorites'); } 
            else { AppState.favorites.unshift(meta); showToast('Saved to Favorites', 'success'); }
            saveSettings();
            if (AppState.currentTrack && AppState.currentTrack.id === id) updateFavIcons();
            if (AppState.currentView === 'favorites' || document.getElementById('view-container')) renderView(AppState.currentView);
        }
        function toggleFavoriteCurrent() {
            if (!AppState.currentTrack) return;
            toggleFavoriteId(AppState.currentTrack.id, encodeURIComponent(JSON.stringify(AppState.currentTrack)));
        }
        function updateFavIcons() {
            const t = AppState.currentTrack; if(!t) return;
            const isFav = AppState.favorites.some(f => f.id === t.id && f.mode === t.mode);
            const cls = isFav ? 'ph-fill ph-heart text-rose-500' : 'ph ph-heart';
            
            const pb = document.getElementById('player-fav-btn');
            pb.disabled = false;
            pb.className = 'ml-auto transition-colors touch-target ' + (isFav ? 'text-rose-500' : 'text-slate-400 hover:text-white');
            pb.innerHTML = `<i class="${cls} text-xl"></i>`;
            document.getElementById('m-full-fav').innerHTML = `<i class="${cls} text-3xl"></i>`;
            document.getElementById('m-full-fav').className = isFav ? 'text-rose-500 shrink-0 touch-target' : 'text-slate-400 hover:text-white transition-colors shrink-0 touch-target';
        }

        function openFullscreenPlayer() {
            const p = document.getElementById('mobile-full-player');
            p.classList.remove('hidden'); setTimeout(()=>p.classList.add('active'), 10);
        }
        function closeFullscreenPlayer() {
            const p = document.getElementById('mobile-full-player');
            p.classList.remove('active'); setTimeout(()=>p.classList.add('hidden'), 300);
        }

        function handleFeedbackSubmit(e) {
            e.preventDefault();
            const msg = document.getElementById('feedback-msg').value;
            window.location.href = `mailto:aryansharma98@gmail.com,etho98g@gmail.com?subject=A.S Music Feedback&body=${encodeURIComponent(msg)}`;
            showToast('Opening mail client...', 'info');
            e.target.reset();
        }

        // Global Keydown Listener
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            switch (e.code) {
                case 'Space': e.preventDefault(); togglePlayPause(); break;
                case 'ArrowRight': if(AppState.audio.duration) AppState.audio.currentTime = Math.min(AppState.audio.currentTime + 5, AppState.audio.duration); break;
                case 'ArrowLeft': if(AppState.audio.duration) AppState.audio.currentTime = Math.max(AppState.audio.currentTime - 5, 0); break;
                case 'ArrowUp': e.preventDefault(); handleVolume(Math.min(AppState.audio.volume + 0.1, 1)); break;
                case 'ArrowDown': e.preventDefault(); handleVolume(Math.max(AppState.audio.volume - 0.1, 0)); break;
                case 'KeyN': playNext(); break;
                case 'KeyP': playPrev(); break;
            }
        });

        // Init
        window.addEventListener('load', () => {
            const loader = document.getElementById('app-loader');
            if (loader) {
                loader.classList.add('opacity-0');
                setTimeout(() => loader.remove(), 500);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            updateVolumeUI();
            updateControlStyles();
            
            document.getElementById('volume-bar').value = AppState.settings.volume;
            
            // Auto switch mode based on nav active if needed, default is online/home
            navigate('home');
            updateNavHighlights();
        });
    </script>
</body>
</html>
